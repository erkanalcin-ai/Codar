# Codar license policy (Phase 1). Only verified-permissive licenses allowed.
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "Zlib",
  "CC0-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
]

[[licenses.clarify]]
name = "encoding_rs"
expression = "Apache-2.0 OR MIT OR BSD-3-Clause"
license-files = [{ path = "COPYRIGHT", hash = 0 }]

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
