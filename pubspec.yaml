name: codar
description: "Local-first Flutter and Rust ebook reader for Codar."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Android versionName/versionCode and iOS build name/number come from this value.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Codar Phase 1 — exact pins per Phase 0 audit.
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  sqflite: 2.4.3
  path_provider: 2.1.6
  file_picker: 12.2.0
  shared_preferences: 2.5.5
  intl: 0.20.3
  flutter_rust_bridge: 2.13.0
  rust_lib_codar:
    path: rust_builder
  freezed_annotation: ^3.1.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^4.0.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # Phase 1 spike fixtures (tiny, bundled for on-device proof).
  assets:
    - assets/spike/min.epub
    - assets/spike/spike.pdf
    - assets/spike/spike.cbz
    - assets/spike/spike_tr.txt
    - assets/spike/spike.fb2
    # Codar Transparent Brand Kit (READ FURTHER; PNG artwork is authoritative).
    - assets/brand/codar_splash_background.png
    - assets/brand/read_further/codar_logo_horizontal_dark_transparent.png
    - assets/brand/read_further/codar_logo_horizontal_light_transparent.png
    - assets/brand/read_further/codar_logo_stacked_dark_transparent.png
    - assets/brand/read_further/codar_logo_stacked_light_transparent.png
    - assets/brand/read_further/codar_icon_color_transparent.png
    - assets/brand/read_further/codar_icon_dark_transparent.png
    - assets/brand/read_further/codar_icon_light_transparent.png
    - assets/brand/read_further/codar_icon_mono_dark_transparent.png
    - assets/brand/read_further/codar_icon_mono_light_transparent.png
    - assets/brand/read_further/codar_icon_minimal_transparent.png
    - assets/brand/read_further/icons/codar_app_icon_1024.png
    - assets/brand/codar_logo_reference_stacked_transparent.png
    - assets/brand/codar_logo_reference_horizontal_transparent.png
    - assets/brand/codar_logo_premium_transparent.png
    - assets/brand/codar_logo_premium_v2_transparent.png
    - assets/brand/codar_app_icon_premium_1024.png
    - assets/brand/codar_app_icon_symbol_1024.png
    - assets/brand/codar_home_hero_background.png
